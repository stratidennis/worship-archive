name: Desktop builds

# Installers are built on demand and on a version tag, not on every push: each run
# downloads an Electron runtime per platform and takes minutes, and nobody needs a new
# installer for a typo in a comment.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      # One platform failing should still leave you with the other installer, which is
      # usually the one you were waiting for.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            role: leader
            config: electron-builder.yml
            label: macOS · leader
            native_args: ''
            artifact: worship-archive-leader-macOS
          - os: windows-latest
            args: --win --x64
            role: leader
            config: electron-builder.yml
            label: Windows · leader · x64
            native_args: --arch x64
            artifact: worship-archive-leader-Windows-x64
          - os: windows-latest
            args: --win --ia32
            role: leader
            config: electron-builder.yml
            label: Windows · leader · 32-bit
            native_args: --arch ia32
            artifact: worship-archive-leader-Windows-ia32
          - os: macos-latest
            args: --mac
            role: band
            config: electron-builder.band.yml
            label: macOS · band
            native_args: ''
            artifact: worship-archive-band-macOS
          - os: windows-latest
            args: --win --x64
            role: band
            config: electron-builder.band.yml
            label: Windows · band · x64
            native_args: --arch x64
            artifact: worship-archive-band-Windows-x64
          - os: windows-latest
            args: --win --ia32
            role: band
            config: electron-builder.band.yml
            label: Windows · band · 32-bit
            native_args: --arch ia32
            artifact: worship-archive-band-Windows-ia32
          - os: macos-latest
            args: --mac
            role: stage
            config: electron-builder.stage.yml
            label: macOS · stage
            native_args: ''
            artifact: worship-archive-stage-macOS
          - os: windows-latest
            args: --win --x64
            role: stage
            config: electron-builder.stage.yml
            label: Windows · stage · x64
            native_args: --arch x64
            artifact: worship-archive-stage-Windows-x64
          - os: windows-latest
            args: --win --ia32
            role: stage
            config: electron-builder.stage.yml
            label: Windows · stage · 32-bit
            native_args: --arch ia32
            artifact: worship-archive-stage-Windows-ia32

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `better-sqlite3` is a native addon and has to match Electron's ABI, not Node's.
      # This is the step that makes the difference between an app that starts and one
      # that dies on launch with NODE_MODULE_VERSION.
      - name: Rebuild native modules for Electron
        if: matrix.role == 'leader'
        run: pnpm --filter @worship/desktop exec electron-builder install-app-deps ${{ matrix.native_args }}

      - name: Build the UI
        run: pnpm --filter @worship/ui build

      - name: Bundle the main process
        run: pnpm --filter @worship/desktop build:${{ matrix.role }}

      - name: Package
        run: pnpm --filter @worship/desktop exec electron-builder --config ${{ matrix.config }} ${{ matrix.args }} --publish never
        env:
          # macOS uses the explicit ad-hoc identity from electron-builder.yml. Prevent
          # automatic certificate discovery so all CI runners produce the same bundle.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          # The installers only. `release/` also holds the unpacked app directory, which
          # is hundreds of megabytes and of no use to anyone downloading this.
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # A tag publishes; a manual run just leaves the artifacts above.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers

      - uses: softprops/action-gh-release@v3
        with:
          files: installers/**/*
          draft: true
          generate_release_notes: true
          body: |
            ## Installing

            **Windows** — download the `.exe` and run it. Windows SmartScreen will warn
            that the publisher is unknown, because this build is not code-signed:
            choose *More info* → *Run anyway*.

            **macOS** — download the `.dmg`, drag the app to Applications, then
            **right-click it and choose Open** the first time. If macOS still blocks it,
            try opening it once, then go to **System Settings → Privacy & Security** and
            choose **Open Anyway**. The app bundle is ad-hoc signed to protect its
            integrity, but is not Apple-notarised, so macOS asks you to approve its first
            launch.

            Choose the installer for this device's role:

            - **Leader** owns the song library and starts the local-network server.
            - **Band** finds the Leader automatically and opens the musician view.
            - **Stage** finds the Leader automatically and opens the display view.

            Band and Stage can be opened before the Leader. They remain on the waiting
            screen and connect automatically when a compatible Leader appears.
