name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and specifying both is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Added once the repo was actually formatted. Without a gate it drifts back within
      # a few commits, and then nobody runs it because the diff is always enormous.
      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Band desktop bundle
        run: pnpm --filter @worship/desktop build:band

      - name: Build Stage desktop bundle
        run: pnpm --filter @worship/desktop build:stage

      - name: Client bundles do not contain the Leader database
        shell: bash
        run: |
          if grep -q "better-sqlite3" packages/desktop/dist/main.cjs; then
            echo "Client bundle unexpectedly contains better-sqlite3"
            exit 1
          fi

      # Bundling Fastify is the one genuinely risky thing about the desktop build: its
      # plugin system reads function names at registration time, so a bundler change can
      # produce an app that installs perfectly and then refuses to start. That failure
      # would otherwise first appear on a laptop at a church.
      - name: Bundled server actually serves
        run: pnpm --filter @worship/desktop build:leader && pnpm smoke:desktop
