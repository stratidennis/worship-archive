name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and specifying both is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Bundling Fastify is the one genuinely risky thing about the desktop build: its
      # plugin system reads function names at registration time, so a bundler change can
      # produce an app that installs perfectly and then refuses to start. That failure
      # would otherwise first appear on a laptop at a church.
      - name: Bundled server actually serves
        run: pnpm smoke:desktop
