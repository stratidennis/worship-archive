appId: ro.worshiparchive.app
productName: Worship Archive Leader
copyright: MIT
artifactName: Worship-Archive-Leader-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# Needed even though nothing is ever published from the build job.
#
# The `zip` and `nsis` targets are updater-compatible, so electron-builder writes
# `latest-mac.yml` / `latest.yml` alongside them — and that step reads
# `publishConfig.provider`, which is null when no provider is configured. The result is
# `Cannot read properties of null (reading 'provider')` *after* the installers have been
# built, which is why `electron-builder --dir` cannot reproduce it: --dir stops before
# the artifact phase. `--publish never` still means nothing leaves the runner.
publish:
  provider: github
  owner: stratidennis
  repo: worship-archive

# Only the bundle ships. Everything the app needs is inside `dist/` — see
# `scripts/bundle.mjs` — except the one native module, which electron-builder collects
# from `dependencies` and rebuilds for Electron's ABI.
files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json
  # The compiled addon is all that ships. better-sqlite3's 9 MB of C sources and build
  # machinery are only needed to produce it; the app never compiles anything.
  - '!**/node_modules/better-sqlite3/{deps,src,build/Release/obj.target}/**'
  - '!**/node_modules/better-sqlite3/{binding.gyp,build/*.mk,build/Makefile,build/*.gypi}'

# `better-sqlite3` is a .node binary and cannot be read from inside an asar archive.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

npmRebuild: true

mac:
  category: public.app-category.music
  icon: build/icon-mac.png
  extendInfo:
    NSLocalNetworkUsageDescription: Worship Archive uses the local network to connect the Leader, Band, and Stage devices.
    NSBonjourServices:
      - _http._tcp
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ship the installable DMG only. Running an app extracted into Downloads and moving it
  # later leaves any saved login item pointing at the old location.
  # Fully ad-hoc sign the entire bundle. Skipping signing leaves Electron's main binary
  # with its linker signature while the rest of the bundle is unsealed; Gatekeeper then
  # reports the downloaded app as "damaged". `-` needs no Apple developer account and
  # gives every nested framework and helper a consistent local signature. The app is
  # still not Apple-notarised, so the first launch needs the macOS approval flow below.
  identity: '-'
  # Ad-hoc signatures have no Team ID. Electron's nested frameworks therefore cannot
  # satisfy hardened runtime library validation, which is intended for Developer ID
  # signed/notarised builds.
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: Worship Archive
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications

win:
  icon: build/icon.png
  # Installed builds have a stable executable path for Windows' login item. A portable
  # build runs Electron from a temporary extraction directory, so registering
  # `process.execPath` appears in Task Manager but cannot survive a restart.
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: Worship-Archive-Leader-${version}-Windows-${arch}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Worship Archive Leader

linux:
  icon: build/icon.png
  category: Audio
  target:
    - AppImage
